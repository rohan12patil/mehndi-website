<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trisha — Henna &amp; Mehndi Artist</title>
<meta name="description" content="Bridal and party henna by Trisha. Natural henna, home service, Staffordshire based and travelling UK-wide. Book on WhatsApp." />
<meta property="og:title" content="Trisha Heena &amp; Mehndi" />
<meta property="og:description" content="Bridal and party henna. Natural henna only. Home service available." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="lockup">
    <b data-c="brand.name">TRISHA</b>
    <span data-c="brand.sub">HEENA &amp; MEHNDI</span>
  </div>
  <nav class="site-nav">
    <a class="navlink" href="#gallery">GALLERY</a>
    <a class="navlink" href="#services">SERVICES</a>
    <a class="btn-wa sm" data-wa="general" target="_blank" rel="noopener"><span class="dot"></span>WhatsApp</a>
  </nav>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <p class="eyebrow" data-c="hero.eyebrow"></p>
      <h1 data-c="hero.title"></h1>
      <p class="lede" data-c="hero.body"></p>
      <div class="actions">
        <a class="btn-wa" data-wa="booking" target="_blank" rel="noopener" data-c="hero.primaryCta"></a>
        <a class="btn-ghost" href="#gallery" data-c="hero.secondaryCta"></a>
      </div>
      <p class="note" data-c="hero.note"></p>
    </div>
    <div class="ph center shot" data-hero-image><span data-c="hero.imageAlt"></span></div>
  </div>
</section>

<section class="badges" data-list="badges"></section>

<section class="section wrap" id="services">
  <p class="eyebrow" data-c="services.eyebrow"></p>
  <h2 data-c="services.title"></h2>
  <p class="intro" data-c="services.body"></p>
  <div class="grid auto-260" data-list="services"></div>
</section>

<section class="section wrap" id="gallery">
  <p class="eyebrow" data-c="gallery.eyebrow"></p>
  <h2 data-c="gallery.title"></h2>
  <div class="chips" data-list="filters"></div>
  <div class="gallery-grid" data-list="gallery"></div>
  <p class="intro" style="margin-top:20px;margin-bottom:0" data-c="gallery.note"></p>
</section>

<section class="section" style="background:linear-gradient(180deg,#1B1208,#140D07);border-top:1px solid var(--line)">
  <div class="wrap">
    <p class="eyebrow" data-c="trends.eyebrow"></p>
    <h2 style="margin-bottom:26px" data-c="trends.title"></h2>
    <div class="grid auto-230" data-list="trends"></div>
  </div>
</section>

<section class="section wrap">
  <div class="grid auto-280">
    <div>
      <p class="eyebrow" data-c="coverage.eyebrow"></p>
      <h2 style="margin-bottom:16px" data-c="coverage.title"></h2>
      <p class="intro" data-c="coverage.body"></p>
      <div class="areas" data-list="areas"></div>
    </div>
    <div class="panel">
      <h3 data-c="booking.title"></h3>
      <div class="steps" data-list="steps"></div>
      <a class="btn-wa" data-wa="booking" target="_blank" rel="noopener" data-c="booking.cta"></a>
    </div>
  </div>
</section>

<section class="section wrap">
  <div class="grid auto-280">
    <div>
      <p class="eyebrow" data-c="safety.eyebrow"></p>
      <h2 style="margin-bottom:16px" data-c="safety.title"></h2>
      <p class="intro" data-c="safety.body"></p>
      <div class="points" data-list="points"></div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:8px" data-c="safety.warnTitle"></h3>
      <p class="intro" style="margin-bottom:20px" data-c="safety.warnBody"></p>
      <div class="steps" data-list="warnings"></div>
    </div>
  </div>
</section>

<section class="section quotes">
  <div class="wrap">
    <p class="eyebrow" style="margin-bottom:26px" data-c="testimonials.eyebrow"></p>
    <div class="grid auto-260" data-list="testimonials"></div>
  </div>
</section>

<section class="section faq">
  <p class="eyebrow" data-c="faq.eyebrow"></p>
  <h2 style="margin-bottom:26px" data-c="faq.title"></h2>
  <div data-list="faq"></div>
</section>

<section class="closing">
  <h2 data-c="cta.title"></h2>
  <p data-c="cta.body"></p>
  <a class="btn-wa" data-wa="booking" target="_blank" rel="noopener" data-c="cta.button"></a>
  <p class="phone" data-c="contact.phoneDisplay"></p>
</section>

<footer class="site-footer">
  <p class="name"><span data-c="brand.name"></span> <span data-c="brand.sub"></span></p>
  <p class="tag" data-c="brand.tagline"></p>
  <nav>
    <a data-wa="general" target="_blank" rel="noopener">WhatsApp</a>
    <a data-href="instagram" target="_blank" rel="noopener">Instagram</a>
    <a data-href="tel"><span data-c="contact.phoneDisplay"></span></a>
  </nav>
  <p class="legal" data-c="footer.legal"></p>
  <p class="legal" data-c="footer.credits"></p>
</footer>

<div class="sticky-cta">
  <a class="btn-wa" data-wa="booking" target="_blank" rel="noopener" data-c="hero.primaryCta"></a>
</div>

<script src="site.js"></script>
</body>
</html>
